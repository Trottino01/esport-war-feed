name: Esports War Feed

on:
  schedule:
    # Ogni 15 minuti. Se il repository è PRIVATO usa "7,37 * * * *" (ogni 30 min)
    # per restare nei 2.000 minuti gratuiti al mese.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:      # pulsante "Run workflow" per lanciarlo a mano
    inputs:
      test:
        description: "Invia solo un messaggio di prova nel canale"
        type: boolean
        default: false

permissions:
  contents: write         # serve per salvare state.json (i video già inoltrati)

concurrency:
  group: esports-war-feed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Controlla YouTube e pubblica su Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python bot.py ${{ inputs.test && '--test' || '' }}

      - name: Salva lo stato
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aggiorna stato feed [skip ci]"
            git pull --rebase --autostash
            git push
          fi
